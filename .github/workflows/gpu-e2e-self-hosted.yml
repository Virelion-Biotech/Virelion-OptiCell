name: Real GPU Cellpose E2E

on:
  workflow_dispatch:

jobs:
  gpu-cellpose-ui:
    runs-on: [self-hosted, linux, x64, opticell-gpu]
    timeout-minutes: 45
    env:
      OPTICELL_REQUIRE_AUTH: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev,cellpose]"
      - name: Verify CUDA
        run: |
          nvidia-smi
          python - <<'PY'
          import torch
          assert torch.cuda.is_available(), "CUDA is not visible to PyTorch"
          print(torch.cuda.get_device_name(0))
          PY
      - name: Real Cellpose engine smoke
        run: python scripts/real_cellpose_smoke.py
      - name: Real Cellpose Streamlit UI E2E
        run: python scripts/real_cellpose_ui_smoke.py
