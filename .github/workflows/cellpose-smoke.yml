name: Real Cellpose smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 1 * *"

jobs:
  real-cellpose-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[cellpose]"
      - run: python scripts/real_cellpose_smoke.py
