name: CI

on:
  push:
  pull_request:

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pytest
      - run: bandit -r opticell scripts/validate_livecell_artifacts.py -q
      - run: pip-audit . --strict
      - run: ruff check . --select E9,F --ignore F401,F841
      - run: python -m compileall -q opticell app_streamlit.py pages scripts
      - run: python -m opticell --help
      - run: python scripts/validate_livecell_artifacts.py
      - run: python -m build
      - run: sha256sum dist/*
      - run: python -m venv /tmp/opticell-wheel-venv
      - run: /tmp/opticell-wheel-venv/bin/python -m pip install --upgrade pip
      - run: /tmp/opticell-wheel-venv/bin/python -m pip install dist/*.whl
      - run: /tmp/opticell-wheel-venv/bin/python -m pip check
      - run: >-
          /tmp/opticell-wheel-venv/bin/python -c
          "import importlib, importlib.metadata as md; import opticell;
          assert md.version('opticell') == opticell.__version__;
          assert opticell.__all__;
          missing = [name for name in opticell.__all__ if not hasattr(opticell, name)];
          assert not missing, missing;
          wrappers = ['acceptance','artifact_quality','batch','benchmarking','experiment_audit','experiment_qc','experiment_stats','exports','lineage','lineage_events','lineage_quality','ome_io','power','profiling','quality_gate','reproducibility','robustness','runtime','screening','screening_advanced','screening_qc','segmentation','sensitivity','statistics','stream_io','tracking3d','tracking_events','tracking_validation','volumetric_segmentation'];
          [importlib.import_module('opticell.' + name) for name in wrappers];
          print('OptiCell isolated wheel API OK', opticell.__version__)"
      - run: python -m venv /tmp/opticell-sdist-venv
      - run: /tmp/opticell-sdist-venv/bin/python -m pip install --upgrade pip
      - run: /tmp/opticell-sdist-venv/bin/python -m pip install dist/*.tar.gz
      - run: /tmp/opticell-sdist-venv/bin/python -m pip check
      - run: >-
          /tmp/opticell-sdist-venv/bin/python -c
          "import importlib.metadata as md; import opticell;
          assert md.version('opticell') == opticell.__version__;
          assert opticell.__all__;
          from opticell import audit_experiment;
          print('OptiCell isolated sdist API OK', opticell.__version__)"

  container-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build --build-arg OPTICELL_EXTRAS=ui -t opticell-ci .
