name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pytest
      - run: ruff check . --select E9,F --ignore F401,F841
      - run: python -m compileall -q qc_pipeline.py quantitative.py image_io.py validation.py compartments.py phenotype.py tracking.py ensemble.py experiment.py texture.py preprocessing.py volumetric.py volumetric_segmentation.py tracking3d.py provenance.py reporting.py benchmarking.py runtime.py tracking_events.py experiment_stats.py experiment_qc.py profiling.py lineage.py screening.py stream_io.py screening_qc.py sensitivity.py lineage_events.py artifact_quality.py acceptance.py robustness.py quality_gate.py screening_advanced.py reproducibility.py tracking_validation.py experiment_audit.py opticell
      - run: python qc_pipeline.py --help
      - run: python -m build
      - run: sha256sum dist/*
      - run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - run: python -c "import importlib, statistics; assert hasattr(statistics, 'mean'); import opticell; assert opticell.__version__ == '2.16.0'; missing = [name for name in opticell.__all__ if not hasattr(opticell, name)]; assert not missing, missing; wrappers = ['acceptance','artifact_quality','batch','benchmarking','experiment_audit','experiment_qc','experiment_stats','exports','lineage','lineage_events','lineage_quality','ome_io','power','profiling','quality_gate','reproducibility','robustness','runtime','screening','screening_advanced','screening_qc','segmentation','sensitivity','statistics','stream_io','tracking3d','tracking_events','tracking_validation','volumetric_segmentation']; [importlib.import_module('opticell.' + name) for name in wrappers]; print('OptiCell wheel API contract OK', opticell.__version__)"
      - run: python -m pip uninstall -y opticell
      - run: python -m pip install --force-reinstall --no-deps dist/*.tar.gz
      - run: python -c "import opticell; assert opticell.__version__ == '2.16.0'; assert opticell.__all__; from opticell import audit_experiment; print('OptiCell sdist API OK', opticell.__version__)"
