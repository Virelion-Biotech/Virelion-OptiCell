name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pytest
      - run: ruff check . --select E9,F --ignore F401,F841
      - run: python -m compileall -q qc_pipeline.py quantitative.py image_io.py validation.py compartments.py phenotype.py tracking.py ensemble.py experiment.py texture.py preprocessing.py volumetric.py volumetric_segmentation.py tracking3d.py provenance.py reporting.py benchmarking.py runtime.py tracking_events.py experiment_stats.py experiment_qc.py profiling.py lineage.py screening.py stream_io.py screening_qc.py sensitivity.py lineage_events.py artifact_quality.py acceptance.py robustness.py quality_gate.py screening_advanced.py reproducibility.py tracking_validation.py experiment_audit.py opticell
      - run: python qc_pipeline.py --help
      - run: python -m build
      - run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - run: python -c "import statistics; assert hasattr(statistics, 'mean'); import opticell; import opticell.acceptance, opticell.analysis, opticell.artifact_quality, opticell.features, opticell.io, opticell.segmentation, opticell.statistics, opticell.tracking, opticell.experiment, opticell.experiment_qc, opticell.profiling, opticell.volumetric, opticell.volumetric_segmentation, opticell.benchmarking, opticell.runtime, opticell.tracking_events, opticell.experiment_stats, opticell.lineage, opticell.lineage_quality, opticell.lineage_events, opticell.ome_io, opticell.power, opticell.screening, opticell.screening_advanced, opticell.screening_qc, opticell.exports, opticell.robustness, opticell.sensitivity, opticell.stream_io, opticell.quality_gate, opticell.reproducibility, opticell.tracking_validation, opticell.experiment_audit; from opticell import Tracking3DConfig, OMEImageInfo, AssayQCDecision, SegmentationAcceptance, ExperimentQualityGate, ExperimentAudit, build_manifest, build_report, build_lineage_table, division_consistency, lineage_event_summary, lineage_quality_summary, two_group_sample_size, z_prime_factor, assay_qc_decision, threshold_sensitivity, acquisition_artifact_metrics, artifact_burden_score, segmentation_acceptance, summarize_sensitivity, stable_parameter_subset, experiment_quality_gate, audit_experiment, memmap_tiff, dataframe_to_long_form, b_score, ssmd, plate_uniformity, analysis_fingerprint, compare_manifests, track_fragmentation, track_gap_rate, track_purity; print('OptiCell wheel imports OK', opticell.__version__, len(Tracking3DConfig.__annotations__))"
