name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pytest
      - run: ruff check . --select E9,F --ignore F401,F841
      - run: python -m compileall -q qc_pipeline.py quantitative.py image_io.py validation.py compartments.py phenotype.py tracking.py ensemble.py experiment.py texture.py preprocessing.py volumetric.py volumetric_segmentation.py tracking3d.py provenance.py reporting.py benchmarking.py runtime.py tracking_events.py experiment_stats.py experiment_qc.py profiling.py lineage.py screening.py stream_io.py opticell
      - run: python qc_pipeline.py --help
      - run: python -m build
      - run: python -c "import statistics; assert hasattr(statistics, 'mean'); import opticell; import opticell.analysis, opticell.features, opticell.io, opticell.segmentation, opticell.statistics, opticell.tracking, opticell.experiment, opticell.experiment_qc, opticell.profiling, opticell.volumetric, opticell.volumetric_segmentation, opticell.benchmarking, opticell.runtime, opticell.tracking_events, opticell.experiment_stats, opticell.lineage, opticell.screening, opticell.stream_io; from opticell import Tracking3DConfig, build_manifest, build_report, capabilities, benchmark_backends, detect_time_series_events, normalize_to_controls, profile_call, summarize_experiment, build_lineage_table, z_prime_factor, memmap_tiff; print('OptiCell package imports OK', opticell.__version__, capabilities().cpu_count)"
