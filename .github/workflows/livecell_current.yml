name: LIVECell current n20 benchmark

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/livecell_current.yml

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache LIVECell data
        uses: actions/cache@v4
        with:
          path: data/livecell
          key: livecell-val-${{ runner.os }}-${{ hashFiles('scripts/run_livecell_validation.py') }}
      - name: Install
        run: python -m pip install -e '.[cellpose]'
      - name: Run current hybrid n20
        run: python scripts/run_livecell_validation.py --split val --max-images 20 --backend hybrid
      - name: Run current auto n20
        run: python scripts/run_livecell_validation.py --split val --max-images 20 --backend auto --skip-download
      - name: Write comparison report
        run: python scripts/write_livecell_comparison.py
      - name: Commit measured benchmark outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git pull --rebase origin main
          git add outputs/livecell_validation
          if git diff --cached --quiet; then
            echo "No benchmark output changes."
            exit 0
          fi
          git commit -m "data: refresh current LIVECell n20 benchmark"
          git push
