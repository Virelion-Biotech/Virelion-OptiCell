[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opticell"
version = "2.4.0"
description = "Quantitative microscopy quality control and cell analysis engine"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.9,<5",
  "pandas>=2.1,<3",
  "tifffile>=2024.2,<2027",
]

[project.optional-dependencies]
cellpose = ["cellpose"]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]

[project.scripts]
opticell = "qc_pipeline:_main"

[tool.setuptools]
py-modules = [
  "qc_pipeline",
  "quantitative",
  "image_io",
  "validation",
  "compartments",
  "phenotype",
  "tracking",
  "ensemble",
  "experiment",
  "statistics",
  "texture",
  "preprocessing",
]

[tool.setuptools.packages.find]
include = ["opticell*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
